[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchiq"
version = "1.0.0"
description = "Search-quality insights, synonym/misspelling discovery, and an analytics agent for the Spinneys grocery catalogue"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=9.0"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
searchiq = "searchiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
searchiq = ["store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:searchiq.*"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
# The fixture catalogue is a data table: one product per line, Arabic and
# English names side by side. Wrapping those rows to satisfy a column limit
# would make them considerably harder to read and to keep in step.
"tests/conftest.py" = ["E501"]
